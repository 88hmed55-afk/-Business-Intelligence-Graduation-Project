[project]
name = "nova-bi-backend"
version = "1.0.0"
description = "Business Intelligence Management System API"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "sqlalchemy==2.0.36",
    "psycopg2-binary==2.9.10",
    "alembic==1.14.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "PyJWT==2.10.1",
    "bcrypt==4.0.1",
    "python-multipart==0.0.20",
    "redis==5.2.1",
    "email-validator==2.2.0",
    "httpx==0.28.1",
    "openpyxl==3.1.5",
    "reportlab==4.2.5",
    "arabic-reshaper==3.0.1",
    "python-bidi==0.6.11",
]

# Tells the Vercel Python runtime where the FastAPI ASGI application lives.
# The ASGI object is `app` defined in backend/app/main.py.
[tool.vercel]
entrypoint = "app.main:app"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
